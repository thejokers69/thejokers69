# golangci-lint configuration file
# ESLint-style rules for Go code quality

run:
  timeout: 5m
  tests: true

issues:
  exclude-dirs:
    - vendor
    - _site
    - node_modules
  exclude-files:
    - ".*\\.pb\\.go$"
    - ".*_templ\\.go$" # Skip templ generated files
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-use-default: false
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
        - funlen
        - gocognit
        - gocyclo
    - path: ".*_templ\\.go$"
      linters:
        - all

linters-settings:
  revive:
    rules:
      - name: exported
        severity: warning
      - name: unexported-return
        severity: warning
      - name: error-return
        severity: error
      - name: error-naming
        severity: error
      - name: errorf
        severity: error
      - name: if-return
        severity: warning
      - name: increment-decrement
        severity: warning
      - name: var-naming
        severity: warning
      - name: var-declaration
        severity: warning
      - name: range
        severity: warning
      - name: range-val-in-closure
        severity: warning
      - name: range-val-address
        severity: error
      - name: waitgroup-by-value
        severity: error
      - name: atomic
        severity: error
      - name: empty-block
        severity: warning
      - name: superfluous-else
        severity: warning
      - name: unused-parameter
        severity: warning
      - name: unhandled-error
        severity: error
      - name: cognitive-complexity
        severity: warning
        arguments:
          - 50
      - name: function-length
        severity: warning
        arguments:
          - 100
          - 50
      - name: function-result-limit
        severity: warning
        arguments:
          - 3
      - name: max-public-structs
        severity: warning
        arguments:
          - 5
      - name: cyclomatic
        severity: warning
        arguments:
          - 15
      - name: file-header
        severity: warning
      - name: package-comments
        severity: warning

  govet:
    enable-all: true

  errcheck:
    check-type-assertions: true
    check-blank: true
    exclude-functions:
      - fmt:.*
      - io/ioutil:^Read.*

  gosimple:
    checks: ["all"]

  staticcheck:
    checks: ["all"]

  unused:
    check-exported: true

  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
    disabled-checks:
      - dupImport
      - ifElseChain
      - octalLiteral
      - whyNoLint
      - wrapperFunc

  gosec:
    severity: medium
    confidence: medium

  gofmt:
    simplify: true

  goimports:
    local-prefixes: github.com/thejokers69/thejokers69

  misspell:
    locale: US

  lll:
    line-length: 120
    tab-width: 1

  dupl:
    threshold: 100

  funlen:
    lines: 100
    statements: 50

  gocognit:
    min-complexity: 15

  gocyclo:
    min-complexity: 15

  unconvert:
    fast: true

  unparam:
    check-exported: false

  whitespace:
    multi-if: true
    multi-func: true

linters:
  disable-all: true
  enable:
    - revive
    - govet
    - errcheck
    - gosimple
    - staticcheck
    - unused
    - gocritic
    - gosec
    - gofmt
    - goimports
    - misspell
    - lll
    - dupl
    - funlen
    - gocognit
    - gocyclo
    - unconvert
    - unparam
    - whitespace
    - ineffassign
    - typecheck
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - bodyclose
    - contextcheck
    - containedctx
    - errname
    - errorlint
    - err113
    - exhaustive
    - forbidigo
    - gochecknoglobals
    - gochecknoinits
    - godot
    - godox
    - goheader
    - mnd
    - gomodguard
    - goprintffuncname
    - grouper
    - importas
    - makezero
    - nakedret
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - prealloc
    - predeclared
    - promlinter
    - stylecheck
    - tagliatelle
    - thelper
    - tparallel
    - varnamelen
    - wrapcheck
    - wsl
    - copyloopvar
    - usetesting
