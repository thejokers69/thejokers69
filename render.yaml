services:
  - type: web
    name: thejokers69-portfolio
    env: go
    buildCommand: go install github.com/a-h/templ/cmd/templ@v0.3.960 && templ generate ./templates/... && go build -o server ./cmd/server/main.go
    startCommand: ./server
    envVars:
      - key: BASEURL
        value: /thejokers69
      - key: URL
        generateValue: true
      - key: PORT
        fromService:
          type: web
          name: thejokers69-portfolio
          property: port
      - key: POSTHOG_API_KEY
        sync: false
      - key: POSTHOG_HOST
        value: https://eu.i.posthog.com
