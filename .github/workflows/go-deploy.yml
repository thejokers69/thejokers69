name: Build Go Application for Deployment

permissions:
  contents: read
  pull-requests: read
  checks: write
  actions: read

on:
  push:
    branches:
      - preview
      - master
  workflow_dispatch:

env:
  GO_VERSION: "1.25.3"
  TEMPL_VERSION: "v0.3.960"

jobs:
  build:
    name: Build Go Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependencies: true

      - name: Install templ
        run: |
          go install github.com/a-h/templ/cmd/templ@${{ env.TEMPL_VERSION }}

      - name: Generate templ files
        run: |
          templ generate ./templates/...

      - name: Verify templ imports are not duplicated
        run: |
          dup_found=0
          while IFS= read -r -d '' f; do
            count=$(grep -c '"github.com/a-h/templ"' "$f" || true)
            if [ "$count" -gt 1 ]; then
              echo "Duplicate templ import found in $f (count=$count)"
              dup_found=1
            fi
          done < <(find templates -type f -name "*.go" -print0)
          if [ "$dup_found" -eq 1 ]; then
            echo "❌ Duplicate templ import detected"
            exit 1
          fi

      - name: Download dependencies
        run: |
          go mod download
          go mod verify

      - name: Build application
        run: |
          go build -v -o server ./cmd/server/main.go
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64

      - name: Verify build
        run: |
          if [ -f server ]; then
            echo "✅ Build successful"
            ls -lh server
            file server
          else
            echo "❌ Build failed"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server-binary-linux-amd64
          path: server
          retention-days: 30

  build-multi-platform:
    name: Build for Multiple Platforms
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependencies: true

      - name: Install templ
        run: |
          go install github.com/a-h/templ/cmd/templ@${{ env.TEMPL_VERSION }}

      - name: Generate templ files
        run: |
          templ generate ./templates/...

      - name: Verify templ imports are not duplicated
        run: |
          dup_found=0
          while IFS= read -r -d '' f; do
            count=$(grep -c '"github.com/a-h/templ"' "$f" || true)
            if [ "$count" -gt 1 ]; then
              echo "Duplicate templ import found in $f (count=$count)"
              dup_found=1
            fi
          done < <(find templates -type f -name "*.go" -print0)
          if [ "$dup_found" -eq 1 ]; then
            echo "❌ Duplicate templ import detected"
            exit 1
          fi

      - name: Download dependencies
        run: |
          go mod download
          go mod verify

      - name: Build for ${{ matrix.goos }}/${{ matrix.goarch }}
        run: |
          OUTPUT="server-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            OUTPUT="${OUTPUT}.exe"
          fi
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -v -o "${OUTPUT}" ./cmd/server/main.go
        env:
          CGO_ENABLED: 0

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: server-${{ matrix.goos }}-${{ matrix.goarch }}*
          retention-days: 30
